workflows:
  ios-release:
    name: SARAN FF CLEAN iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: SARAN-FF-CLEAN.xcodeproj
        XCODE_SCHEME: SARAN-FF-CLEAN
      ios_signing:
        distribution_type: development
        bundle_identifier: com.saranff.clean
    scripts:
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
